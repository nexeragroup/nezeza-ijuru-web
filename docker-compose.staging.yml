services:
  web:
    image: ${WEB_IMAGE:-nezeza-web:staging}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONFIGURATION: staging
        API_PROXY_TARGET: ${API_PROXY_TARGET:?API_PROXY_TARGET is required}
        SITE_URL: ${SITE_URL:?SITE_URL is required}
        ROBOTS_INDEXABLE: ${ROBOTS_INDEXABLE:-false}
        STAGING_API_PROXY_TARGET: https://staging-api.nezezaijuru.org
        STAGING_SITE_URL: https://staging.nezezaijuru.org
        STAGING_ROBOTS_INDEXABLE: false
        PRODUCTION_API_PROXY_TARGET: https://api.nezezaijuru.org
        PRODUCTION_SITE_URL: https://nezezaijuru.org
        PRODUCTION_ROBOTS_INDEXABLE: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4200
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      ROBOTS_INDEXABLE: ${ROBOTS_INDEXABLE:-false}
    ports:
      - "127.0.0.1:10302:4200"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
